pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories { google(); mavenCentral() }
}

rootProject.name = 'NovelAI Local Android'
include ':app', ':capacitor-android', ':capacitor-app', ':capacitor-browser'
