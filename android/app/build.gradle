plugins { id 'com.android.application' }

android {
    namespace 'cc.idlecloud.nai.local'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'cc.idlecloud.nai.local'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 2
        versionName '0.1.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            // 界面集成测试使用独立的应用数据，与用户验收包并装。
            if (providers.gradleProperty('naiLayoutTest').isPresent()) {
                applicationIdSuffix '.layouttest'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main {
            assets.srcDir providers.gradleProperty('naiAssets')
            jniLibs.srcDir layout.buildDirectory.dir('generated/nai/jniLibs')
            res.srcDir '../../src-tauri/icons/android'
        }
    }
    packaging {
        // Rust 按实际文件路径加载应用内的 ORT 库，安装时需要解包。
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-browser')
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
