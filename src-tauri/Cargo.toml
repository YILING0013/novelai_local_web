[package]
name = "novelai-local"
version = "2.0.8"
description = "NovelAI local desktop application"
edition = "2021"
license-file = "../LICENSE"

[lib]
name = "novelai_local"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
local-ip-address = "0.6"
tower-http = { version = "0.6", features = ["fs", "limit"] }
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
openssl = { version = "0.10", features= ["vendored"] }
hyper-openssl = {version="0.10",features= ["client-legacy"] }
hyper-util = {version="0.1",features= ["client-legacy", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "blocking", "rustls-tls"] }
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
url = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
libloading = "0.8"
axum = { version = "0.8", features = ["multipart"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
blake2 = "0.10"
argon2 = "0.5"
crypto_secretbox = "0.1"
chrono = "0.4"
csv = "1"
percent-encoding = "2"
serde_urlencoded = "0.7"
rand = "0.8"
regex = "1"
flate2 = "1"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
