name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install and verify backend
        working-directory: nai_flask
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q .
          python -m pytest -q
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install and verify frontend
        working-directory: next_nai_web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Verify release boundary
        run: python scripts/verify_release.py
